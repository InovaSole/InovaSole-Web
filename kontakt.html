    <header>
      <nav class="horni-lista">
        <div id="menu" class="visible">
          <a href="index.html" class="nav-odkaz-domu">Domů</a>

      </nav>

      <div style="display: flex; justify-content: flex-end">
        <header class="navbar">
          <button class="hamburger" id="hamburger" aria-label="Otevřít navigaci">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </header>

        <nav class="mobilni-menu" role="navigation" aria-label="Hlavní navigace">

          <ul class="mobile-nav">
            <li><a href="index.html">Domů</a></li>

            <li><a href="kontakt.html" class="nav-active">kontakt</a></li>
          </ul>

        </nav>

      </div>
    </header>

    <main class="formular-main">

      <section class="formular-section">

      <h1 class="formular-nadpis">Kontaktní formulář</h1>
      <p class="formular-podnadpis">Zaujal vás náš produkt?<br>Napište nám a společně vymyslíme, co dál.</p>

        <form class="formular-form" action="https://formsubmit.co/contact@inovasole.com" method="POST">

          <div class="formular-groups-around-div">

            <div class="formular-jmeno valid">
              <input class="formular-jmeno-input" type="text" id="formular-jmeno" name="jmeno" autocomplete="name" placeholder=" ">
              <label class="formular-jmeno-label" for="formular-jmeno">Jméno a Příjmení</label>
              <span class="formular-jmeno-validace"></span>
              <small class="formular-jmeno-hlaska"></small>
            </div>

            <div class="formular-email">
              <input class="formular-email-input" type="email" id="formular-email" name="email" autocomplete="email">
              <label class="formular-email-label" for="formular-email">Email</label>
              <span class="formular-email-validace"></span>
              <small class="formular-email-hlaska"></small>
            </div>

            <div class="formular-predmet">
              <input class="formular-predmet-input" type="text" id="formular-predmet">
              <label class="formular-predmet-label" for="formular-predmet">Předmět</label>
              <span class="formular-predmet-validace"></span>
              <small class="formular-predmet-hlaska"></small>
            </div>

            <div class="formular-zprava">
              <textarea class="formular-zprava-textarea" name="message" id="formular-zprava"></textarea>
              <label class="formular-zprava-label" for="formular-zprava">Vaše zpráva<span>...</span></label>
              <span class="formular-zprava-validace"></span>
              <small class="formular-zprava-hlaska"></small>
            </div>

            <div class="formular-button">
              <button class="formular-submit" type="submit">Odeslat formulář</button>
            </div>

          </div>

          <input type="hidden" name="_subject" id="subject" value="">
          <input type="hidden" name="_template" value="box">
          <input type="text" name="_honey" style="display: none;">

        </form>

      </section>

    </main>

    <footer>
      <div class="ohraniceni">
        <p>
          <strong>Adresa: </strong>Ostrava, Česká republika <br />
          <strong>Kontakt: </strong>
          <a
            href="mailto:contact@inovasole.com"
            style="text-decoration: none; color: inherit"
            >contact@inovasole.com</a
          >
          <br />
        </p>

            ©2026 InovaSole. Všechna práva vyhrazena.
            <a href="#" style="color: inherit">↑</a>
          </p>
        </div>
      </div>
    </footer>
