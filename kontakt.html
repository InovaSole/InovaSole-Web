      </div>
    </header>

    <article class="contact-page">
      <div class="contact-wrap">
        <h1 class="nadpis">Kontaktujte nás:</h1>
        <form
          action="https://formsubmit.co/469afa659f72bcad3911eb48faa24648"
          method="POST"
          class="kont kontakt-box"
        >
          <!-- Pole pro jméno -->
          <label for="name" class="p-intro">Jméno:</label>
          <input
            type="text"
            name="name"
            id="name"
            class="text-field"
            required
          />

          <!-- Pole pro e-mail odesílatele -->
          <label for="email" class="p-intro">Váš E-mail:</label>
          <input
            type="email"
            name="email"
            id="email"
            class="text-field"
            required
          />

          <!-- Pole pro zprávu -->
          <label for="message" class="p-intro">Zpráva:</label>
          <textarea
            name="message"
            id="message"
            class="text-field"
            required
          ></textarea>

          <!-- Tlačítko pro odeslání -->
          <button type="submit" class="push-button">Odeslat zprávu</button>
        </form>
      </div>
    </article>

    <footer>
      <div class="ohraniceni">
        <p>
          <strong>Adresa: </strong>Ostrava, Česká republika <br />
          <strong>Kontakt: </strong>

            >contact@inovasole.com</a
